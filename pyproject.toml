[project]
name = "wind-pilot"
version = "0.1.0"
description = "Wind data pipeline (OpenWindMap station 2176) — Lac du Bourget"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dlt = [
    "dlt[postgres]>=1.0",
    "requests>=2.31",
]
dbt = [
    "dbt-core>=1.8.0,<2.0.0",
    "dbt-postgres>=1.8.0,<2.0.0",
]
streamlit = [
    "streamlit>=1.35",
    "plotly>=5.20",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
]

[tool.uv]
# Not an installable Python package (no src/, no cross-folder imports) —
# just a dependency grouping by concern.
package = false
